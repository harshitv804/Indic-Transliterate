<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indic Transliterate — live word-by-word demo</title>
<style>
  :root {
    --bg: #f6f7f9;
    --line: #e4e7ec;
    --line-strong: #d3d8e0;
    --panel: #ffffff;
    --panel-soft: #fbfcfd;
    --text: #111827;
    --muted: #68707f;
    --faint: #9aa1ad;
    --accent: #2563eb;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 56px 24px 64px;
  }

  header {
    padding-bottom: 22px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(24px, 3vw, 32px);
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--text);
  }

  .sub {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .sub b { color: #3d4553; font-weight: 600; }

  .board { display: grid; gap: 12px; }

  .row {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    padding: 16px 18px;
    opacity: 0.6;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    transition: opacity .4s ease, border-color .4s ease, box-shadow .4s ease;
  }

  .row.active {
    opacity: 1;
    border-color: var(--line-strong);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05),
                0 8px 20px -18px rgba(16, 24, 40, 0.35);
  }

  .row.done { opacity: 0.82; }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 12px;
  }

  .lang {
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.005em;
  }

  .tag {
    font-size: 11.5px;
    color: var(--muted);
    background: #f4f5f7;
    border: 1px solid var(--line);
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .beam {
    margin-left: auto;
    font-size: 10.5px;
    color: var(--faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .panes {
    display: grid;
    grid-template-columns: 1fr 30px 1fr;
    gap: 10px;
    align-items: stretch;
  }

  .pane {
    border: 1px solid #eef0f3;
    border-radius: 8px;
    background: var(--panel-soft);
    padding: 11px 13px;
    min-height: 72px;
  }

  .label {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 6px;
  }

  .text {
    font-size: 16.5px;
    line-height: 1.6;
    min-height: 26px;
    color: var(--text);
    word-break: break-word;
    font-family: "Inter", "Segoe UI", "Noto Sans Tamil", "Noto Sans Telugu",
                 "Noto Sans Malayalam", "Noto Sans Kannada", "Noto Sans Devanagari",
                 system-ui, sans-serif;
  }

  .text.out { font-weight: 500; }

  .caret::after {
    content: "";
    display: inline-block;
    width: 1.5px;
    height: 1.05em;
    margin-left: 2px;
    vertical-align: -0.15em;
    background: var(--accent);
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .arrow {
    display: grid;
    place-items: center;
    color: #c2c7d0;
    font-size: 15px;
  }

  footer {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--muted);
    font-size: 13px;
  }

  .play {
    font: inherit;
    color: var(--text);
    background: #ffffff;
    border: 1px solid var(--line-strong);
    padding: 7px 15px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
  }

  .play:hover { background: #f6f7f9; border-color: #c2c8d2; }

  .stats { margin-left: auto; display: flex; gap: 18px; color: var(--muted); }

  .stats span b { color: #3d4553; font-weight: 600; font-variant-numeric: tabular-nums; }

  @media (max-width: 720px) {
    .wrap { padding: 36px 18px 48px; }
    .panes { grid-template-columns: 1fr; }
    .arrow { display: none; }
    .beam { display: none; }
    .stats { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Indic Transliterate</h1>
    <p class="sub">
      Live word-by-word transliteration &middot; <b>5.37M</b> parameters &middot;
      <b>12 MB</b> ONNX &middot; beam search &middot; trained on Aksharantar
    </p>
  </header>

  <div class="board" id="board"></div>

  <footer>
    <button class="play" id="replay">Replay</button>
    <span id="status">Starting&hellip;</span>
    <span class="stats">
      <span>train loss <b>0.063</b></span>
      <span>val loss <b>0.155</b></span>
    </span>
  </footer>
</div>

<script>
  // Outputs are real model predictions (beam size 4).
  const DATA = [
    {
      lang: "Tamil",
      tag: "en → ta",
      text: "Good morning, how are you?",
      words: {
        good: "கூட்",
        morning: "மோர்னிங்",
        how: "ஹோவ்",
        are: "அரே",
        you: "யூ"
      }
    },
    {
      lang: "Telugu",
      tag: "en → te",
      text: "Welcome to Hyderabad.",
      words: { welcome: "వెల్కోమ్", to: "టో", hyderabad: "హైడరాబాద్" }
    },
    {
      lang: "Malayalam",
      tag: "en → ml",
      text: "Thank you very much.",
      words: { thank: "തങ്ക്", you: "യോ", very: "വെറി", much: "മുച്ച്" }
    },
    {
      lang: "Kannada",
      tag: "en → kn",
      text: "Welcome to Bangalore.",
      words: { welcome: "ವೆಲ್ಕೋಮ್", to: "ಟೊ", bangalore: "ಬಂಗಳೋರ್" }
    },
    {
      lang: "Hindi",
      tag: "en → hi",
      text: "Good morning friends.",
      words: { good: "गूड", morning: "मोर्निंग", friends: "फ्राइंड्स" }
    }
  ];

  const WORD_CHAR = /[\p{L}\p{M}]/u;
  const board = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const replayBtn = document.getElementById("replay");

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  function splitRuns(text) {
    const runs = [];
    let start = 0;
    let current = WORD_CHAR.test(text[0]);

    for (let i = 1; i < text.length; i++) {
      const isWord = WORD_CHAR.test(text[i]);
      if (isWord !== current) {
        runs.push({ isWord: current, start, end: i, text: text.slice(start, i) });
        start = i;
        current = isWord;
      }
    }
    runs.push({ isWord: current, start, end: text.length, text: text.slice(start) });
    return runs;
  }

  // Mirrors the app: a word is translated once a separator (space or
  // punctuation) follows it; the word being typed stays raw.
  function composeOutput(demo, typedLength, runs) {
    let out = "";
    for (const run of runs) {
      if (run.start >= typedLength) break;
      const visible = demo.text.slice(run.start, Math.min(run.end, typedLength));
      if (!run.isWord) {
        out += visible;
      } else if (run.end < typedLength) {
        out += demo.words[run.text.toLowerCase()] || visible;
      } else {
        out += visible;
      }
    }
    return out;
  }

  function buildRow(demo, index) {
    const row = document.createElement("section");
    row.className = "row";
    row.innerHTML = [
      '<div class="head">',
      '  <span class="lang">' + demo.lang + "</span>",
      '  <span class="tag">' + demo.tag + "</span>",
      '  <span class="beam">beam 4</span>',
      "</div>",
      '<div class="panes">',
      '  <div class="pane">',
      '    <div class="label">Input</div>',
      '    <div class="text" id="in-' + index + '"></div>',
      "  </div>",
      '  <div class="arrow">→</div>',
      '  <div class="pane">',
      '    <div class="label">Output</div>',
      '    <div class="text out" id="out-' + index + '"></div>',
      "  </div>",
      "</div>"
    ].join("");
    board.appendChild(row);

    return {
      row,
      input: row.querySelector("#in-" + index),
      output: row.querySelector("#out-" + index)
    };
  }

  const rows = DATA.map(buildRow);

  function resetRows() {
    rows.forEach((r) => {
      r.row.className = "row";
      r.input.textContent = "";
      r.output.textContent = "";
      r.input.classList.remove("caret");
      r.output.classList.remove("caret");
    });
  }

  async function playDemo(demo, index, alive) {
    const view = rows[index];
    const runs = splitRuns(demo.text);

    view.row.className = "row active";
    statusEl.textContent = "Typing " + demo.lang + " (" + demo.tag + ")";
    view.input.classList.add("caret");
    view.output.classList.add("caret");

    for (let typed = 0; typed <= demo.text.length; typed++) {
      if (!alive()) return;

      const prefix = demo.text.slice(0, typed);
      const char = demo.text[typed - 1];

      view.input.textContent = prefix;
      view.output.textContent = composeOutput(demo, typed, runs);

      if (typed === demo.text.length) break;

      // Word boundaries get a beat so the commit is visible.
      const isBoundary = char === " " || /[.,!?;:]/.test(char);
      await sleep(isBoundary ? 230 : 46);
    }

    view.input.classList.remove("caret");
    view.output.classList.remove("caret");
    view.row.className = "row done";

    await sleep(900);
  }

  let runToken = 0;

  async function run() {
    const token = ++runToken;
    const alive = () => token === runToken;

    resetRows();
    statusEl.textContent = "Starting…";

    for (let i = 0; i < DATA.length; i++) {
      if (!alive()) return;
      await playDemo(DATA[i], i, alive);
    }

    if (!alive()) return;
    statusEl.textContent = "All five languages done — replaying";
    await sleep(1800);

    if (!alive()) return;
    run();
  }

  replayBtn.addEventListener("click", () => {
    run();
  });

  run();
</script>
</body>
</html>
